<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Megève par cœur</title>
<link rel="icon" type="image/png" href="../img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1f3d7a;--snow:#f4f6fa;--ink:#16213a;--muted:#5b6782;--line:#dbe2ee;--card:#fff;--heart:#d6283c;--ok:#1f7a4d;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--snow);color:var(--ink);font:16px/1.5 "Figtree",system-ui,sans-serif}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header b{font-size:1.1rem}
header a{color:#fff}
main{max-width:1100px;margin:0 auto;padding:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
h2{margin:0 0 10px;font-size:1.2rem}
label{font-weight:600;font-size:.9rem;display:block;margin-bottom:4px}
input,select{font:inherit;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;width:100%;background:#fff;color:var(--ink)}
button{font:600 .95rem "Figtree",sans-serif;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;background:var(--navy);color:#fff}
button.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
button.danger{background:#fff;color:var(--heart);border:1.5px solid var(--heart);padding:6px 12px;font-size:.85rem}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--heart);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>div{flex:1;min-width:180px}
.muted{color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.it{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.it img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#e5e9f0}
.it .f{padding:10px;display:grid;gap:8px}
.it.del{opacity:.35}
.it.new{outline:3px solid var(--ok)}
.bar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#status{font-weight:600}
.err{color:var(--heart)} .ok{color:var(--ok)}
.hidden{display:none}
</style>
</head>
<body>
<header><b>Megève par cœur · Admin</b><a href="../">Voir le site</a></header>
<main>

<section class="box" id="login">
  <h2>Connexion</h2>
  <p class="muted">Collez votre clé GitHub (elle reste uniquement dans ce navigateur).</p>
  <div class="row">
    <div><label for="tok">Clé GitHub</label><input id="tok" type="password" autocomplete="off" placeholder="github_pat_…"></div>
    <button id="go">Se connecter</button>
  </div>
  <p id="loginErr" class="err"></p>
</section>

<div id="app" class="hidden">
  <section class="box">
    <h2>Ajouter des photos</h2>
    <div class="row">
      <div><label for="ncat">Catégorie</label><input id="ncat" list="cats" placeholder="Automne, Hiver, Événements…"></div>
      <div><label for="nev">Nom de l'événement (facultatif)</label><input id="nev" placeholder="Les Toquicimes"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div><label for="files">Photos</label><input id="files" type="file" accept="image/*" multiple></div>
    </div>
    <p class="muted">Les photos sont allégées automatiquement. Ajoutez une légende ci-dessous, puis cliquez sur « Publier ».</p>
  </section>

  <section class="box">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 style="margin:0">Photos du site (<span id="count">0</span>)</h2>
      <div style="flex:0 0 220px"><select id="filter" aria-label="Filtrer par catégorie"></select></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</div>
<datalist id="cats"></datalist>
</main>

<div class="bar hidden" id="bar">
  <span id="status" class="muted">Aucune modification.</span>
  <div style="display:flex;gap:10px">
    <button class="ghost" id="logout">Se déconnecter</button>
    <button id="publish" disabled>Publier</button>
  </div>
</div>

<script>
const OWNER="vincentdutheil", REPO="megeveparcoeur", BRANCH="main", DATA="data/photos.json";
const $=id=>document.getElementById(id);
let token="", photos=[], filter="all", changed=false;
function store(k,v){try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
async function gh(path,opt={}){
  const r=await fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+path,{...opt,headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json",...(opt.body?{"Content-Type":"application/json"}:{})}});
  if(!r.ok){const t=await r.text();throw new Error(r.status+" "+t.slice(0,200));}
  return r.json();
}
function esc(t){return String(t??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function setStatus(t,cls){$("status").textContent=t;$("status").className=cls||"muted";}
function markChanged(){changed=true;$("publish").disabled=false;
  const n=photos.filter(p=>p._new).length,d=photos.filter(p=>p._del).length;
  setStatus(`Modifications non publiées${n?` · ${n} ajout(s)`:""}${d?` · ${d} suppression(s)`:""}`);}

async function connect(){
  token=$("tok").value.trim()||load("mpc_tok")||"";
  if(!token) return;
  $("loginErr").textContent="";
  try{
    const f=await gh("/contents/"+DATA+"?ref="+BRANCH);
    photos=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(f.content.replace(/\n/g,"")),c=>c.charCodeAt(0))));
    store("mpc_tok",token);
    $("login").classList.add("hidden");$("app").classList.remove("hidden");$("bar").classList.remove("hidden");
    render();
  }catch(e){$("loginErr").textContent="Connexion impossible : vérifiez la clé. ("+e.message.slice(0,80)+")";store("mpc_tok",null);}
}
function cats(){return [...new Set(photos.filter(p=>!p._del).map(p=>p.cat))];}
function render(){
  const cs=cats();
  $("cats").innerHTML=cs.map(c=>`<option value="${esc(c)}">`).join("");
  $("filter").innerHTML=`<option value="all">Toutes les catégories</option>`+cs.map(c=>`<option ${c===filter?"selected":""}>${esc(c)}</option>`).join("");
  $("count").textContent=photos.filter(p=>!p._del).length;
  $("grid").innerHTML=photos.map((p,k)=>({p,k})).filter(({p})=>filter==="all"||p.cat===filter).map(({p,k})=>`
    <div class="it ${p._del?"del":""} ${p._new?"new":""}" data-k="${k}">
      <img src="${p._preview||("../"+p.thumb)}" alt="${esc(p.t)}" loading="lazy">
      <div class="f">
        <div><label for="t${k}">Légende</label><input id="t${k}" data-f="t" value="${esc(p.t)}"></div>
        <div><label for="c${k}">Catégorie</label><input id="c${k}" data-f="cat" list="cats" value="${esc(p.cat)}"></div>
        <div><label for="e${k}">Événement</label><input id="e${k}" data-f="ev" value="${esc(p.ev||"")}" placeholder="—"></div>
        <button class="danger" data-act="del">${p._del?"Annuler la suppression":"Supprimer"}</button>
      </div>
    </div>`).join("");
}
$("grid").addEventListener("input",e=>{const it=e.target.closest(".it");if(!it||!e.target.dataset.f)return;
  const p=photos[+it.dataset.k];const v=e.target.value;
  if(e.target.dataset.f==="ev"){if(v.trim())p.ev=v;else delete p.ev;}else p[e.target.dataset.f]=v;markChanged();});
$("grid").addEventListener("click",e=>{if(e.target.dataset.act!=="del")return;const k=+e.target.closest(".it").dataset.k;
  const p=photos[k];if(p._new){photos.splice(k,1);}else p._del=!p._del;markChanged();render();});
$("filter").addEventListener("change",e=>{filter=e.target.value;render();});

function slug(s){return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"photo";}
function resize(file,max,q){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{
  const r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");
  c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  res(c.toDataURL("image/jpeg",q));URL.revokeObjectURL(img.src);};img.onerror=rej;img.src=URL.createObjectURL(file);});}
$("files").addEventListener("change",async e=>{
  const cat=$("ncat").value.trim()||"Divers", ev=$("nev").value.trim();
  setStatus("Préparation des photos…");
  for(const f of e.target.files){
    try{
      const big=await resize(f,1600,.82), th=await resize(f,640,.75);
      const base=slug(f.name.replace(/\.[^.]+$/,""))+"-"+Date.now().toString(36);
      const p={src:"photos/"+base+".jpg",thumb:"photos/"+base+"-thumb.jpg",t:"",cat,_new:true,_big:big,_th:th,_preview:th};
      if(ev)p.ev=ev;photos.unshift(p);
    }catch(err){setStatus("Impossible de lire "+f.name,"err");}
  }
  e.target.value="";filter="all";markChanged();render();
});

async function publish(){
  $("publish").disabled=true;setStatus("Publication en cours…");
  try{
    const ref=await gh("/git/ref/heads/"+BRANCH);
    const head=await gh("/git/commits/"+ref.object.sha);
    const tree=[];
    for(const p of photos.filter(p=>p._new)){
      for(const [path,data] of [[p.src,p._big],[p.thumb,p._th]]){
        const b=await gh("/git/blobs",{method:"POST",body:JSON.stringify({content:data.split(",")[1],encoding:"base64"})});
        tree.push({path,mode:"100644",type:"blob",sha:b.sha});
      }
    }
    for(const p of photos.filter(p=>p._del)){tree.push({path:p.src,mode:"100644",type:"blob",sha:null});tree.push({path:p.thumb,mode:"100644",type:"blob",sha:null});}
    const clean=photos.filter(p=>!p._del).map(p=>{const o={src:p.src,thumb:p.thumb,t:p.t,cat:(p.cat||"Divers").trim()};if(p.ev)o.ev=p.ev.trim();if(p.video)o.video=true;return o;});
    tree.push({path:DATA,mode:"100644",type:"blob",content:JSON.stringify(clean,null,1)+"\n"});
    const t=await gh("/git/trees",{method:"POST",body:JSON.stringify({base_tree:head.tree.sha,tree})});
    const c=await gh("/git/commits",{method:"POST",body:JSON.stringify({message:"Mise à jour de la galerie depuis l'admin",tree:t.sha,parents:[ref.object.sha]})});
    await gh("/git/refs/heads/"+BRANCH,{method:"PATCH",body:JSON.stringify({sha:c.sha})});
    photos=clean;changed=false;render();
    setStatus("Publié ✓ Le site sera à jour dans environ une minute.","ok");
  }catch(e){setStatus("Échec de la publication : "+e.message.slice(0,120),"err");$("publish").disabled=false;}
}
$("publish").onclick=publish;
$("go").onclick=connect;
$("tok").addEventListener("keydown",e=>{if(e.key==="Enter")connect();});
$("logout").onclick=()=>{store("mpc_tok",null);location.reload();};
window.addEventListener("beforeunload",e=>{if(changed){e.preventDefault();e.returnValue="";}});
if(load("mpc_tok")) connect();
</script>
</body>
</html>

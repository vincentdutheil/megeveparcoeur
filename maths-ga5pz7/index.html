<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le camp des maths ⛷️</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0b1c36">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito+Sans:opsz,wght@6..12,600;6..12,800;6..12,900&display=swap" rel="stylesheet">
<style>
:root{--night:#0b1c36;--blue:#1f3d7a;--sky:#dfeaf7;--snow:#f6f9fd;--ink:#14213a;--muted:#5d6b80;--line:#d6e0ee;--heart:#d8323f;--ok:#1f8a4c;--ko:#d8323f;--gold:#f2b632;--card:#fff;
  --display:"Fraunces",Georgia,serif;--body:"Nunito Sans",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);color:var(--ink);background:linear-gradient(#0b1c36 0,#1f3d7a 260px,var(--snow) 260px);min-height:100vh;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header{color:#fff;padding:22px 0 18px;position:relative;overflow:hidden}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,6vw,2.4rem);margin:0;line-height:1.1}
h1 small{display:block;font-family:var(--body);font-size:.95rem;font-weight:700;opacity:.8;margin-top:4px}
.stars{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 14px;font-weight:900;font-size:1.1rem;white-space:nowrap}
.peaks{display:block;width:100%;height:60px;margin-top:-10px}
main{padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 10px 30px rgba(11,28,54,.08);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:20px;padding:16px;cursor:pointer;min-height:130px;transition:transform .15s,border-color .15s}
.mode:hover,.mode:focus-visible{border-color:var(--blue);transform:translateY(-2px);outline:none}
.mode .ic{font-size:2rem}.mode b{font-size:1.1rem;font-weight:900}.mode span{color:var(--muted);font-size:.88rem;font-weight:600}
.mode i{font-style:normal;font-size:.8rem;font-weight:800;color:var(--blue);margin-top:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.back{border:0;background:var(--sky);color:var(--blue);font-weight:900;border-radius:999px;padding:9px 14px;cursor:pointer}
.pill{background:var(--sky);border-radius:999px;padding:7px 12px;font-weight:900;color:var(--blue)}
.pill.t{background:#fff4dc;color:#8a5a00}
.q{font-family:var(--display);font-weight:700;font-size:clamp(2rem,9vw,3.2rem);text-align:center;margin:18px 0 8px;line-height:1.15}
.qtext{font-size:clamp(1.1rem,4.4vw,1.35rem);font-weight:700;line-height:1.5;text-align:center;margin:14px 0}
.ans{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.ans input{width:150px;text-align:center;font-size:2rem;font-weight:900;border:3px solid var(--line);border-radius:16px;padding:10px;background:var(--snow)}
.ans input:focus{outline:none;border-color:var(--blue);background:#fff}
.ans .frac{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.ans .frac input{width:90px;font-size:1.6rem;padding:6px}.ans .frac hr{width:100px;border:0;border-top:4px solid var(--ink);margin:0}
.unit{font-weight:900;font-size:1.3rem}
.go{border:0;background:var(--heart);color:#fff;font-weight:900;font-size:1.15rem;border-radius:999px;padding:14px 26px;cursor:pointer;box-shadow:0 6px 0 #a3202b}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 #a3202b}
.go.alt{background:var(--blue);box-shadow:0 6px 0 #122a57}
.go:disabled{opacity:.5}
.cmp button{font-size:2rem;font-weight:900;width:78px;height:70px;border-radius:18px;border:3px solid var(--line);background:#fff;cursor:pointer}
.cmp button:hover{border-color:var(--blue)}
.fb{min-height:2.2em;text-align:center;font-weight:900;font-size:1.15rem;margin:8px 0}
.fb.ok{color:var(--ok)}.fb.ko{color:var(--ko)}
.bar{height:12px;background:var(--sky);border-radius:999px;overflow:hidden;margin:4px 0 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff9a3c);border-radius:999px;transition:width .3s}
.picks{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0 16px}
.picks button{width:58px;height:58px;border-radius:16px;border:3px solid var(--line);background:#fff;font-weight:900;font-size:1.3rem;cursor:pointer}
.picks button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.center{text-align:center}
.result .big{font-family:var(--display);font-size:3.4rem;font-weight:700;margin:6px 0}
.mistakes{list-style:none;padding:0;margin:10px auto;max-width:380px;text-align:left}
.mistakes li{padding:8px 12px;border-radius:12px;background:#fff1f2;margin:6px 0;font-weight:700}
.mistakes li b{color:var(--ok)}
svg.shape{display:block;margin:6px auto;max-width:100%}
/* opérations posées */
.pose{display:flex;justify-content:center;margin:10px 0 4px;overflow-x:auto;padding-bottom:6px}
.op{display:grid;gap:4px;justify-content:center}
.op .c{width:44px;height:50px;display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:900;font-variant-numeric:tabular-nums}
.op input{width:44px;height:50px;text-align:center;font-size:1.6rem;font-weight:900;border:2px solid var(--line);border-radius:10px;background:var(--snow);padding:0}
.op input:focus{outline:none;border-color:var(--blue);background:#fff}
.op input.r{height:30px;font-size:.95rem;color:var(--heart);border-style:dashed;background:#fffafa}
.op .rlab{font-size:.7rem;color:var(--muted);font-weight:800;justify-content:flex-end;padding-right:4px}
.op .sign{color:var(--blue)}
.op .line{grid-column:1/-1;height:4px;background:var(--ink);border-radius:2px;margin:2px 0}
.op input.good{border-color:var(--ok);background:#ecf8f0}.op input.bad{border-color:var(--ko);background:#fff1f2}
.hint{color:var(--muted);font-size:.9rem;text-align:center;font-weight:600;margin:6px 0}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.lvl{display:flex;gap:8px;justify-content:center;margin:6px 0 12px;flex-wrap:wrap}
.lvl button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:900;cursor:pointer}
.lvl button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
#gate{position:fixed;inset:0;background:linear-gradient(#0b1c36,#1f3d7a);color:#fff;display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
#gate form{text-align:center;max-width:340px}
#gate input{width:100%;font-size:1.4rem;text-align:center;border-radius:16px;border:0;padding:14px;margin:16px 0 12px;color:var(--ink)}
#gate p{opacity:.85;font-weight:600}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="gate">
  <form id="gform">
    <div style="font-size:3rem">⛷️🔒</div>
    <h1 style="font-size:1.8rem">Le camp des maths</h1>
    <p>Tape le code secret pour entrer.</p>
    <input id="gcode" type="password" autocomplete="off" autocapitalize="off" aria-label="Code secret" placeholder="Code secret">
    <button class="go" type="submit">Entrer</button>
  </form>
</div>

<header>
  <div class="wrap">
    <h1>Le camp des maths ⛷️<small>Entraîne-toi, gagne des étoiles !</small></h1>
    <div class="stars" id="stars" aria-live="polite">⭐ 0</div>
  </div>
</header>
<svg class="peaks" viewBox="0 0 860 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 60 L90 18 L150 42 L240 6 L330 44 L420 14 L500 40 L590 4 L680 38 L760 16 L860 46 L860 60Z" fill="#f6f9fd"/><path d="M240 6 L262 18 L250 17 L240 24 L230 16 L218 18Z M590 4 L612 16 L598 15 L590 22 L580 14 L568 16Z" fill="#fff"/></svg>

<main class="wrap" id="app"></main>

<canvas class="confetti" id="conf"></canvas>

<script>
/* ======================================================================
   Le camp des maths : exercices CE2–CM1 (5P–6P).
   Page secrète : pas de lien sur le site, pas indexée par Google.
   Les progrès sont gardés sur l'appareil (localStorage).
   ====================================================================== */
const CODE = "flocon"; // code d'accès (simple barrière pour les curieux, pas un vrai mot de passe)
const $ = s => document.querySelector(s);
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const nf = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const store = { get(k, d) { try { const v = localStorage.getItem("cm-" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem("cm-" + k, JSON.stringify(v)); } catch (e) {} } };

/* ---------- accès ---------- */
if (store.get("ok", false)) $("#gate").classList.add("hidden");
$("#gform").addEventListener("submit", e => {
  e.preventDefault();
  if ($("#gcode").value.trim().toLowerCase() === CODE) { store.set("ok", true); $("#gate").classList.add("hidden"); }
  else { const f = $("#gform"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); $("#gcode").value = ""; }
});

/* ---------- étoiles ---------- */
let stars = store.get("stars", 0);
const showStars = () => $("#stars").textContent = "⭐ " + stars;
const addStars = n => { stars += n; store.set("stars", stars); showStars(); };
showStars();
const PRAISE = ["Bravo !", "Super !", "Génial !", "Excellent !", "Trop fort !", "Parfait !", "Champion !", "Yes !"];
const RETRY = ["Presque !", "Pas tout à fait…", "Oups !", "Essaie encore la prochaine fois !"];

/* ---------- confettis ---------- */
function confetti() {
  const c = $("#conf"), x = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const P = Array.from({ length: 120 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, r: 4 + Math.random() * 5, vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2, c: pick(["#d8323f", "#f2b632", "#1f3d7a", "#2bb673", "#7fc8ff", "#fff"]) }));
  let t = 0; (function f() { x.clearRect(0, 0, c.width, c.height); P.forEach(p => { p.x += p.vx; p.y += p.vy; x.fillStyle = p.c; x.fillRect(p.x, p.y, p.r, p.r * 1.6); });
    if (++t < 160) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height); })();
}

/* ======================================================================
   Générateurs de questions : {html, answer, kind:"num"|"frac"|"cmp", unit?, say}
   ====================================================================== */
const NAMES = ["Léo", "Emma", "Hugo", "Jade", "Louis", "Chloé", "Tom", "Lina", "Nathan", "Inès"];
const BOYS = ["Léo", "Hugo", "Louis", "Tom", "Nathan"];
const il = n => BOYS.includes(n) ? "il" : "elle", Il = n => BOYS.includes(n) ? "Il" : "Elle";
const GEN = {
  mental() {
    const t = pick(["add", "add", "sub", "sub", "mul", "mul", "x10", "dbl", "half", "c100"]);
    if (t === "add") { const a = R(12, 79), b = R(9, Math.min(60, 120 - a)); return q(`${a} + ${b}`, a + b); }
    if (t === "sub") { const a = R(30, 120), b = R(6, a - 5); return q(`${a} − ${b}`, a - b); }
    if (t === "mul") { const a = R(2, 10), b = R(2, 10); return q(`${a} × ${b}`, a * b); }
    if (t === "x10") { const a = R(3, 99), m = pick([10, 100]); return q(`${a} × ${m}`, a * m); }
    if (t === "dbl") { const a = R(12, 60); return q(`Le double de ${a}`, a * 2, true); }
    if (t === "half") { const a = R(6, 50) * 2; return q(`La moitié de ${a}`, a / 2, true); }
    const a = R(1, 19) * 5; return q(`${a} + ? = 100`, 100 - a);
  },
  table(tables) { const a = pick(tables), b = R(1, 10); return Math.random() < .5 ? q(`${a} × ${b}`, a * b) : q(`${b} × ${a}`, a * b); },
  probleme() {
    const n = pick(NAMES), k = R(0, 7);
    if (k === 0) { const p = R(3, 9), c = R(12, 35); return t(`${n} achète ${p} forfaits de ski à ${c} € chacun. Combien paie-t-il en tout ?`, p * c, "€"); }
    if (k === 1) { const s = pick([48, 56, 64, 72, 84, 96]), o = R(12, s - 8); return t(`Un télésiège a ${s} places. ${o} places sont occupées. Combien de places sont libres ?`, s - o, "places"); }
    if (k === 2) { const g = R(3, 9), p = R(4, 9); return t(`${g * p} skieurs se répartissent en ${g} groupes égaux. Combien y a-t-il de skieurs dans chaque groupe ?`, p, "skieurs"); }
    if (k === 3) { const a = R(120, 300), b = R(25, 70), c = R(15, 60); return t(`${n} a ${a} € dans sa tirelire. ${Il(n)} dépense ${b} € pour des lunettes de ski, puis ${c} € pour un bonnet. Combien lui reste-t-il ?`, a - b - c, "€"); }
    if (k === 4) { const f = R(3, 8), e = R(2, 5); return t(`Un chalet a ${e} étages. Chaque étage a ${f} fenêtres. Combien de fenêtres a le chalet ?`, e * f, "fenêtres"); }
    if (k === 5) { const h = R(9, 15), m1 = pick([20, 25, 30, 35, 40, 45, 50]), m2 = pick([5, 10, 15, 20]); return t(`${n} prend la télécabine à ${h} h ${m1} et arrive en haut à ${h + 1} h ${String(m2).padStart(2, "0")}. Combien de minutes a duré le trajet ?`, 60 - m1 + m2, "min"); }
    if (k === 6) { const p = R(3, 5), q2 = R(2, 5), pr = R(2, 6); return t(`Au marché de Noël, une crêpe coûte ${pr} € et un chocolat chaud ${p} €. ${n} achète ${q2} crêpes et 1 chocolat chaud. Combien doit-${il(n)} payer ?`, q2 * pr + p, "€"); }
    const tot = R(4, 9) * 10, done = R(1, 3) * 10; return t(`Une piste de luge fait ${tot * 10} mètres. ${n} a déjà descendu ${done * 10} mètres. Combien de mètres reste-t-il ?`, (tot - done) * 10, "m");
  },
  fraction() {
    const k = R(0, 3);
    if (k === 0) { const d = pick([2, 3, 4, 5, 6, 8, 10]), n = R(1, d - 1); return { html: `<p class="qtext">Quelle fraction de la barre est coloriée ?</p>${barSvg(n, d)}`, answer: [n, d], kind: "frac", say: `${n}/${d}` }; }
    if (k === 1) { const d = pick([2, 3, 4, 5, 10]), n = d === 2 ? 1 : R(1, d - 1), m = R(2, 9) * d; return { html: `<p class="q" style="font-size:2.2rem">${fr(n, d)} de ${m}</p><p class="hint">Astuce : divise par ${d}${n > 1 ? ", puis multiplie par " + n : ""}.</p>`, answer: n * m / d, kind: "num" }; }
    if (k === 2) { const d = pick([3, 4, 5, 6, 8, 10]); let a = R(1, d + 2), b = R(1, d + 2); if (Math.random() < .2) b = a;
      return { html: `<p class="qtext">Compare les deux fractions.</p><p class="q">${fr(a, d)} <span style="color:var(--muted)">?</span> ${fr(b, d)}</p>`, answer: a < b ? "<" : a > b ? ">" : "=", kind: "cmp" }; }
    const d = pick([2, 3, 4, 5, 8]), a = R(1, 2 * d); return { html: `<p class="qtext">Compare la fraction avec 1.</p><p class="q">${fr(a, d)} <span style="color:var(--muted)">?</span> 1</p>`, answer: a < d ? "<" : a > d ? ">" : "=", kind: "cmp" };
  },
  mesure() {
    const k = R(0, 5);
    if (k === 0) { const m = R(2, 9); return { html: `<p class="q" style="font-size:2.1rem">${m} m = ? cm</p>`, answer: m * 100, kind: "num", unit: "cm" }; }
    if (k === 1) { const kg = R(1, 5), g = R(1, 9) * 100; return { html: `<p class="q" style="font-size:2.1rem">${kg} kg ${g} g = ? g</p>`, answer: kg * 1000 + g, kind: "num", unit: "g" }; }
    if (k === 2) { const h = R(1, 3), m = pick([5, 10, 15, 20, 30, 45]); return { html: `<p class="q" style="font-size:2.1rem">${h} h ${m} min = ? min</p>`, answer: h * 60 + m, kind: "num", unit: "min" }; }
    if (k === 3) { const km = R(1, 9); return { html: `<p class="q" style="font-size:2.1rem">${km} km = ? m</p>`, answer: km * 1000, kind: "num", unit: "m" }; }
    if (k === 4) { const c = R(2, 9) * 100; return { html: `<p class="q" style="font-size:2.1rem">${c} cm = ? m</p>`, answer: c / 100, kind: "num", unit: "m" }; }
    const l = R(2, 6); return { html: `<p class="q" style="font-size:2.1rem">${l} L = ? cL</p>`, answer: l * 100, kind: "num", unit: "cL" };
  }
};
function q(expr, ans, word) { return { html: `<p class="q"${word ? ' style="font-size:2.1rem"' : ""}>${expr}${word ? "" : " = ?"}</p>`, answer: ans, kind: "num" }; }
function t(text, ans, unit) { return { html: `<p class="qtext">${text}</p>`, answer: ans, kind: "num", unit }; }
function fr(n, d) { return `<span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1"><span>${n}</span><span style="width:1.3em;border-top:4px solid currentColor;margin:4px 0"></span><span>${d}</span></span>`; }
function barSvg(n, d) {
  const W = 300, H = 56, w = W / d; let s = `<svg class="shape" width="${W + 4}" height="${H + 4}" viewBox="-2 -2 ${W + 4} ${H + 4}" role="img" aria-label="barre">`;
  for (let i = 0; i < d; i++) s += `<rect x="${i * w}" y="0" width="${w}" height="${H}" fill="${i < n ? "#f2b632" : "#fff"}" stroke="#14213a" stroke-width="3"/>`;
  return s + "</svg>";
}

/* ======================================================================
   Écrans
   ====================================================================== */
const app = $("#app");
let timer = null;
const stop = () => { if (timer) clearInterval(timer); timer = null; };

function home() {
  stop();
  const best = store.get("best-chrono", 0);
  app.innerHTML = `<div class="card"><div class="grid">
    ${tile("chrono", "⏱️", "Calcul mental", "1 minute pour en réussir un max !", best ? "Record : " + best : "")}
    ${tile("tables", "✖️", "Tables de multiplication", "Choisis tes tables et entraîne-toi.")}
    ${tile("posee-sub", "➖", "Soustraction posée", "Avec les cases pour les retenues.")}
    ${tile("posee-mul", "🧮", "Multiplication posée", "Par 1 ou 2 chiffres, avec retenues.")}
    ${tile("posee-add", "➕", "Addition posée", "Plusieurs grands nombres.")}
    ${tile("problemes", "🏔️", "Problèmes", "Des petites histoires à la montagne.")}
    ${tile("fractions", "🍕", "Fractions", "Colorier, comparer, calculer.")}
    ${tile("mesures", "📏", "Mesures", "Mètres, grammes, minutes…")}
    ${tile("melange", "🎲", "Un peu de tout", "Un mélange surprise de 12 questions.")}
  </div></div>`;
  app.querySelectorAll(".mode").forEach(b => b.onclick = () => MODES[b.dataset.m]());
}
const tile = (m, ic, b, s, i) => `<button class="mode" data-m="${m}"><span class="ic">${ic}</span><b>${b}</b><span>${s}</span>${i ? `<i>${i}</i>` : ""}</button>`;
const topbar = (title, right = "") => `<div class="top"><button class="back" id="back">← Retour</button><b style="font-size:1.1rem">${title}</b>${right || "<span></span>"}</div>`;
const bindBack = () => $("#back").onclick = home;

/* ---------- moteur de série (questions une par une) ---------- */
function series(title, gen, total, { timed = 0, onEnd } = {}) {
  stop();
  let i = 0, good = 0, cur = null, left = timed, lock = false; const errs = [];
  app.innerHTML = `<div class="card">${topbar(title, `<span class="pill ${timed ? "t" : ""}" id="cnt"></span>`)}
    <div class="bar"><i id="prog" style="width:0"></i></div>
    <div id="qa"></div><div class="fb" id="fb" aria-live="polite"></div></div>`;
  bindBack();
  const cnt = $("#cnt");
  const upd = () => { cnt.textContent = timed ? `⏱️ ${left} s · ✅ ${good}` : `${Math.min(i + 1, total)} / ${total}`;
    $("#prog").style.width = (timed ? (timed - left) / timed : i / total) * 100 + "%"; };
  function next() {
    if (!timed && i >= total) return end();
    cur = gen(); lock = false;
    let input;
    if (cur.kind === "frac") input = `<div class="frac"><input id="n1" inputmode="numeric" aria-label="numérateur" autocomplete="off"><hr><input id="n2" inputmode="numeric" aria-label="dénominateur" autocomplete="off"></div>`;
    else if (cur.kind === "cmp") input = `<div class="cmp row">${["<", "=", ">"].map(s => `<button data-s="${s}">${s}</button>`).join("")}</div>`;
    else input = `<input id="n1" inputmode="decimal" autocomplete="off" aria-label="réponse">${cur.unit ? `<span class="unit">${cur.unit}</span>` : ""}`;
    $("#qa").innerHTML = cur.html + `<form class="ans" id="af">${input}${cur.kind === "cmp" ? "" : '<button class="go" type="submit">OK</button>'}</form>`;
    $("#fb").textContent = ""; $("#fb").className = "fb";
    const f = $("#af");
    if (cur.kind === "cmp") f.querySelectorAll("button").forEach(b => b.onclick = e => { e.preventDefault(); check(b.dataset.s); });
    else { f.onsubmit = e => { e.preventDefault(); check(cur.kind === "frac" ? [$("#n1").value, $("#n2").value] : $("#n1").value); }; setTimeout(() => $("#n1") && $("#n1").focus(), 30); }
    upd();
  }
  function check(v) {
    if (lock) return;
    let ok;
    if (cur.kind === "frac") { if (v[0] === "" || v[1] === "") return; ok = +v[0] === cur.answer[0] && +v[1] === cur.answer[1]; }
    else if (cur.kind === "cmp") ok = v === cur.answer;
    else { if (String(v).trim() === "") return; ok = Math.abs(parseFloat(String(v).replace(",", ".").replace(/\s/g, "")) - cur.answer) < 1e-9; }
    lock = true; i++;
    const show = cur.kind === "frac" ? cur.say : String(cur.answer).replace(".", ",") + (cur.unit ? " " + cur.unit : "");
    const fb = $("#fb");
    if (ok) { good++; fb.className = "fb ok"; fb.textContent = "✅ " + pick(PRAISE); }
    else { fb.className = "fb ko"; fb.textContent = "❌ " + pick(RETRY) + " La réponse était " + show + ".";
      errs.push({ q: $("#qa").querySelector(".q,.qtext")?.textContent.replace(" = ?", "") || "", a: show }); }
    upd();
    setTimeout(next, ok ? (timed ? 350 : 700) : (timed ? 1300 : 2200));
  }
  function end() {
    stop(); const n = timed ? i : total;
    const earned = timed ? good : good; addStars(earned);
    let rec = "";
    if (timed) { const best = store.get("best-chrono", 0); if (good > best) { store.set("best-chrono", good); rec = `<p style="font-weight:900;color:#8a5a00">🏆 Nouveau record !</p>`; } else rec = `<p class="hint">Ton record : ${best}</p>`; }
    if (good >= n * .8 || rec.includes("🏆")) confetti();
    const msg = good === n ? "Sans faute, incroyable ! 🤩" : good >= n * .8 ? "Très beau travail ! 💪" : good >= n * .5 ? "C'est bien, continue ! 🙂" : "On s'entraîne encore un peu ? 💡";
    app.innerHTML = `<div class="card center result">${topbar(title)}
      <p class="big">${good}${timed ? "" : " / " + n}</p><p style="font-weight:900;font-size:1.2rem">${timed ? "bonnes réponses en 1 minute" : ""}</p>
      <p style="font-weight:800">${msg}</p>${rec}<p>+ ${earned} ⭐</p>
      ${errs.length ? `<p class="hint">Les erreurs à revoir :</p><ul class="mistakes">${errs.slice(0, 12).map(e => `<li>${e.q} → <b>${e.a}</b></li>`).join("")}</ul>` : ""}
      <div class="row"><button class="go" id="again">Rejouer</button><button class="go alt" id="home2">Menu</button></div></div>`;
    bindBack(); $("#again").onclick = () => (onEnd || (() => series(title, gen, total, { timed })))(); $("#home2").onclick = home;
  }
  if (timed) timer = setInterval(() => { left--; upd(); if (left <= 0) { stop(); setTimeout(end, 250); } }, 1000);
  next();
}

/* ---------- opérations posées ---------- */
const digits = n => String(n).split("").map(Number);
function poseScreen(kind) {
  stop();
  const LV = { "posee-sub": ["3 chiffres", "4 chiffres", "5 chiffres"], "posee-add": ["2 nombres", "3 nombres", "4 nombres"], "posee-mul": ["× 1 chiffre", "× 2 chiffres", "Grands × 2 chiffres"] }[kind];
  let lvl = store.get("lvl-" + kind, 0), done = 0, good = 0;
  const title = { "posee-sub": "Soustraction posée", "posee-add": "Addition posée", "posee-mul": "Multiplication posée" }[kind];
  function make() {
    if (kind === "posee-sub") { const k = 3 + lvl; let a = R(10 ** (k - 1) * 2, 10 ** k - 1), b = R(10 ** (k - 1), a - 10 ** (k - 2)); return { nums: [a, b], sign: "−", res: a - b }; }
    if (kind === "posee-add") { const c = 2 + lvl, nums = Array.from({ length: c }, () => R(100, lvl ? 9999 : 999)); return { nums, sign: "+", res: nums.reduce((s, x) => s + x, 0) }; }
    if (lvl === 0) { const a = R(120, 999), b = R(3, 9); return { nums: [a, b], sign: "×", res: a * b }; }
    const a = lvl === 1 ? R(23, 99) : R(123, 999), b = R(12, 99); return { nums: [a, b], sign: "×", res: a * b, partial: [a * (b % 10), a * Math.floor(b / 10) * 10] };
  }
  let cur;
  function render() {
    cur = make();
    const lines = [...cur.nums.map(String)], resLen = String(cur.res).length;
    const parts = cur.partial ? cur.partial.map(String) : [];
    const W = Math.max(resLen, ...lines.map(s => s.length), ...parts.map(s => s.length)) + 1; // +1 colonne pour le signe
    const cols = `repeat(${W},44px)`;
    let h = `<div class="op" style="grid-template-columns:${cols}">`;
    // ligne de retenues (cases libres, au-dessus du premier nombre)
    for (let c = 0; c < W; c++) h += c === 0 ? `<div class="c rlab">ret.</div>` : `<input class="r" inputmode="numeric" maxlength="2" aria-label="retenue colonne ${W - c}" autocomplete="off">`;
    lines.forEach((s, li) => {
      for (let c = 0; c < W; c++) {
        const k = c - (W - s.length);
        if (c === 0 && li === lines.length - 1) h += `<div class="c sign">${cur.sign}</div>`;
        else h += `<div class="c">${k >= 0 ? s[k] : ""}</div>`;
      }
      // retenues de la 2e ligne pour la soustraction par compensation (cases sous le 1er nombre)
      if (kind === "posee-sub" && li === 0) for (let c = 0; c < W; c++) h += c === 0 ? `<div class="c rlab"></div>` : `<input class="r" inputmode="numeric" maxlength="2" aria-label="retenue du bas colonne ${W - c}" autocomplete="off">`;
    });
    h += `<div class="line"></div>`;
    const resRow = (name, len, sign) => { let r = ""; for (let c = 0; c < W; c++) r += c >= W - len ? `<input class="d" data-row="${name}" data-col="${W - 1 - c}" inputmode="numeric" maxlength="1" aria-label="chiffre" autocomplete="off">` : `<div class="c${c === 0 && sign ? " sign" : ""}">${c === 0 && sign ? sign : ""}</div>`; return r; };
    if (parts.length) {
      parts.forEach((p, pi) => { h += resRow("p" + pi, Math.min(W - 1, Math.max(p.length, (pi === 0 ? String(cur.nums[0] * 9).length : String(cur.nums[0] * 90).length))), pi === parts.length - 1 ? "+" : ""); });
      h += `<div class="line"></div>`;
    }
    h += resRow("res", resLen) + `</div>`;
    app.innerHTML = `<div class="card">${topbar(title, `<span class="pill">${good} / ${done}</span>`)}
      <div class="lvl">${LV.map((l, k) => `<button data-l="${k}" aria-pressed="${k === lvl}">${l}</button>`).join("")}</div>
      <div class="pose">${h}</div>
      <p class="hint">${cur.partial ? "Remplis les deux lignes intermédiaires (n'oublie pas le 0 sur la 2e ligne !), puis le résultat. " : ""}Commence par la droite : le curseur avance tout seul vers la gauche. Les petites cases servent aux retenues.</p>
      <div class="fb" id="fb" aria-live="polite"></div>
      <div class="row"><button class="go" id="chk">Vérifier</button><button class="go alt" id="new">Nouveau calcul</button></div></div>`;
    bindBack();
    app.querySelectorAll(".lvl button").forEach(b => b.onclick = () => { lvl = +b.dataset.l; store.set("lvl-" + kind, lvl); render(); });
    const ins = [...app.querySelectorAll("input.d")];
    ins.forEach(inp => {
      inp.addEventListener("input", () => { inp.value = inp.value.replace(/\D/g, "").slice(-1); inp.classList.remove("good", "bad");
        if (inp.value) { const left = ins.find(x => x.dataset.row === inp.dataset.row && +x.dataset.col === +inp.dataset.col + 1); if (left) left.focus(); } });
      inp.addEventListener("keydown", e => {
        const row = inp.dataset.row, col = +inp.dataset.col;
        const go = c => { const t = ins.find(x => x.dataset.row === row && +x.dataset.col === c); if (t) { t.focus(); e.preventDefault(); } };
        if (e.key === "ArrowLeft") go(col + 1); if (e.key === "ArrowRight") go(col - 1);
        if (e.key === "Backspace" && !inp.value) go(col - 1);
        if (e.key === "Enter") { e.preventDefault(); check(); }
      });
    });
    app.querySelectorAll("input.r").forEach(r => r.addEventListener("input", () => r.value = r.value.replace(/\D/g, "").slice(0, 2)));
    const first = ins.filter(x => x.dataset.row === (cur.partial ? "p0" : "res")).find(x => x.dataset.col === "0"); if (first) first.focus();
    $("#chk").onclick = check; $("#new").onclick = render;
  }
  const rowVal = name => { const c = [...app.querySelectorAll(`input.d[data-row="${name}"]`)]; const s = c.map(x => x.value || " ").join("").trim(); return s === "" ? null : (/\s/.test(s) ? NaN : +s); };
  const mark = (name, target) => { const s = String(target); app.querySelectorAll(`input.d[data-row="${name}"]`).forEach(x => { const col = +x.dataset.col, want = col < s.length ? s[s.length - 1 - col] : ""; x.classList.toggle("good", x.value === want && want !== ""); x.classList.toggle("bad", x.value !== want && (x.value !== "" || want !== "")); }); };
  let tries = 0;
  function check() {
    const v = rowVal("res"), fb = $("#fb");
    if (v === null) { fb.className = "fb ko"; fb.textContent = "Écris ton résultat dans la dernière ligne."; return; }
    let partOk = true;
    if (cur.partial) cur.partial.forEach((p, pi) => { const pv = rowVal("p" + pi); if (pv !== p) partOk = false; mark("p" + pi, p); });
    mark("res", cur.res);
    if (v === cur.res) {
      if (tries === 0) { good++; addStars(cur.partial ? 3 : 2); } done += tries === 0 ? 1 : 0; tries = 0;
      fb.className = "fb ok"; fb.textContent = "✅ " + pick(PRAISE) + (cur.partial && !partOk ? " (le résultat est juste, vérifie quand même tes lignes intermédiaires)" : "");
      confetti(); app.querySelector(".pill").textContent = `${good} / ${done}`;
      $("#chk").disabled = true; setTimeout(() => { $("#chk").disabled = false; render(); }, 2200);
    } else {
      tries++; if (tries === 1) { done++; app.querySelector(".pill").textContent = `${good} / ${done}`; }
      fb.className = "fb ko"; fb.textContent = tries < 3 ? "❌ Pas encore ! Les cases rouges sont à corriger. Vérifie tes retenues 😉" : `La bonne réponse était ${nf(cur.res)}. On en fait un autre ?`;
      if (tries >= 3) { tries = 0; setTimeout(render, 3200); }
    }
  }
  render();
}

/* ---------- tables ---------- */
function tablesScreen() {
  stop();
  let sel = store.get("tables", [2, 3, 4, 5]);
  app.innerHTML = `<div class="card center">${topbar("Tables de multiplication")}
    <p style="font-weight:800">Choisis les tables à travailler :</p>
    <div class="picks">${[2, 3, 4, 5, 6, 7, 8, 9, 10].map(n => `<button data-n="${n}" aria-pressed="${sel.includes(n)}">${n}</button>`).join("")}</div>
    <div class="row"><button class="go" id="start">C'est parti ! (15 questions)</button></div></div>`;
  bindBack();
  app.querySelectorAll(".picks button").forEach(b => b.onclick = () => { const n = +b.dataset.n; sel = sel.includes(n) ? sel.filter(x => x !== n) : [...sel, n]; b.setAttribute("aria-pressed", sel.includes(n)); });
  $("#start").onclick = () => { if (!sel.length) return; store.set("tables", sel); series("Tables de " + sel.sort((a, b) => a - b).join(", "), () => GEN.table(sel), 15, { onEnd: tablesScreen }); };
}

const MODES = {

  tables: tablesScreen,
  "posee-sub": () => poseScreen("posee-sub"),
  "posee-mul": () => poseScreen("posee-mul"),
  "posee-add": () => poseScreen("posee-add"),
  problemes: () => series("Problèmes", GEN.probleme, 8),
  fractions: () => series("Fractions", GEN.fraction, 10),
  mesures: () => series("Mesures", GEN.mesure, 10),

};
